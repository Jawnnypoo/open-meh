[versions]
#noinspection UnusedVersionCatalogEntry
androidCompileSdk = "37"
#noinspection UnusedVersionCatalogEntry
androidMinSdk = "23"
#noinspection UnusedVersionCatalogEntry
androidTargetSdk = "37"

agp = "9.2.1"
kotlin = "2.4.0"
composeMultiplatform = "1.11.1"

activityCompose = "1.13.0"
androidxCore = "1.19.0"
androidxBrowser = "1.10.0"
androidxNavigation3 = "1.1.1"

workManager = "2.11.2"
coroutines = "1.11.0"
serializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"
materialComponents = "1.14.0"
multiplatformSettings = "1.3.0"

coil = "3.5.0"
ktor = "3.5.0"
kermit = "2.1.0"
richText = "0.20.0"
metro = "1.2.1"

[libraries]
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidxNavigation3Ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }

androidxBrowser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
androidxWorkRuntime = { module = "androidx.work:work-runtime", version.ref = "workManager" }
androidxWorkRuntimeKtx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }

materialComponents = { module = "com.google.android.material:material", version.ref = "materialComponents" }

multiplatformSettings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }

coilCompose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coilNetworkKtor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

metroxViewmodelCompose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }

richtextUiMaterial3 = { module = "com.halilibo.compose-richtext:richtext-ui-material3", version.ref = "richText" }
richtextCommonmark = { module = "com.halilibo.compose-richtext:richtext-commonmark", version.ref = "richText" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
